<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Drop shadow for the overall logo -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
    
    <!-- Outer gold glow for text -->
    <filter id="text-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="1" flood-color="#000" flood-opacity="0.8"/>
    </filter>

    <!-- Gradients for cards -->
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff4444"/>
      <stop offset="100%" stop-color="#cc0000"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3399ff"/>
      <stop offset="100%" stop-color="#0044cc"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22cc66"/>
      <stop offset="100%" stop-color="#006622"/>
    </linearGradient>
    <linearGradient id="yellowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffee33"/>
      <stop offset="100%" stop-color="#cc9900"/>
    </linearGradient>

    <!-- Gradient for main oval -->
    <radialGradient id="ovalGrad" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#ff3b30"/>
      <stop offset="70%" stop-color="#d60000"/>
      <stop offset="100%" stop-color="#800000"/>
    </radialGradient>
  </defs>

  <g filter="url(#shadow)">
    <!-- Fanned Cards in Background -->
    <!-- Green Card (left-most) -->
    <rect x="35" y="45" width="45" height="70" rx="6" fill="url(#greenGrad)" stroke="#fff" stroke-width="2" transform="rotate(-28 57 80)"/>
    <circle cx="57" cy="80" r="14" fill="rgba(255,255,255,0.15)" transform="rotate(-28 57 80)"/>
    <text x="57" y="85" font-family="system-ui, sans-serif" font-weight="900" font-size="16" fill="#fff" text-anchor="middle" transform="rotate(-28 57 80) italic">G</text>

    <!-- Blue Card (left-middle) -->
    <rect x="55" y="35" width="45" height="70" rx="6" fill="url(#blueGrad)" stroke="#fff" stroke-width="2" transform="rotate(-12 77 70)"/>
    <circle cx="77" cy="70" r="14" fill="rgba(255,255,255,0.15)" transform="rotate(-12 77 70)"/>
    <text x="77" y="75" font-family="system-ui, sans-serif" font-weight="900" font-size="16" fill="#fff" text-anchor="middle" transform="rotate(-12 77 70) italic">B</text>

    <!-- Yellow Card (right-middle) -->
    <rect x="100" y="35" width="45" height="70" rx="6" fill="url(#yellowGrad)" stroke="#fff" stroke-width="2" transform="rotate(12 122 70)"/>
    <circle cx="122" cy="70" r="14" fill="rgba(255,255,255,0.15)" transform="rotate(12 122 70)"/>
    <text x="122" y="75" font-family="system-ui, sans-serif" font-weight="900" font-size="16" fill="#fff" text-anchor="middle" transform="rotate(12 122 70) italic">Y</text>

    <!-- Red Card (right-most) -->
    <rect x="120" y="45" width="45" height="70" rx="6" fill="url(#redGrad)" stroke="#fff" stroke-width="2" transform="rotate(28 142 80)"/>
    <circle cx="142" cy="80" r="14" fill="rgba(255,255,255,0.15)" transform="rotate(28 142 80)"/>
    <text x="142" y="85" font-family="system-ui, sans-serif" font-weight="900" font-size="16" fill="#fff" text-anchor="middle" transform="rotate(28 142 80) italic">R</text>

    <!-- Main Central Tilted Oval -->
    <ellipse cx="100" cy="110" rx="72" ry="46" fill="url(#ovalGrad)" stroke="#ffcc00" stroke-width="6" transform="rotate(-10 100 110)"/>

    <!-- Inner gold border offset -->
    <ellipse cx="100" cy="110" rx="66" ry="40" fill="none" stroke="#fff" stroke-width="1.5" stroke-dasharray="6,4" opacity="0.8" transform="rotate(-10 100 110)"/>

    <!-- Stylized UNO Text -->
    <!-- Large tilted shadowed text -->
    <text x="97" y="127" 
          font-family="system-ui, -apple-system, 'Impact', sans-serif" 
          font-weight="900" 
          font-size="52" 
          font-style="italic" 
          text-anchor="middle" 
          fill="#ffcc00" 
          stroke="#000" 
          stroke-width="7" 
          paint-order="stroke fill"
          filter="url(#text-glow)"
          transform="rotate(-10 100 110) skewX(-6)"
          letter-spacing="-1">
      UNO
    </text>
    
    <!-- Foreground text fill overlap for the classic white highlight edge -->
    <text x="97" y="127" 
          font-family="system-ui, -apple-system, 'Impact', sans-serif" 
          font-weight="900" 
          font-size="52" 
          font-style="italic" 
          text-anchor="middle" 
          fill="#ffcc00" 
          stroke="#fff" 
          stroke-width="2" 
          paint-order="stroke fill"
          transform="rotate(-10 100 110) skewX(-6)"
          letter-spacing="-1">
      UNO
    </text>
  </g>
</svg>
